name: Multiskrypt Otodom - Sprzedaż, Wynajem i Statystyki

on:
  schedule:
    # Uruchamia się co 12 godzin (05:30 i 17:30 UTC)
    # W Polsce (czas zimowy) to 06:30 i 18:30
    - cron: '30 5,17 * * *'
  workflow_dispatch: # Przycisk do ręcznego odpalania

jobs:
  automation-job:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # SKRYPT 1: SPRZEDAŻ
      - name: Uruchom - OTODOM SELL
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_tom_sell.py

      # SKRYPT 2: WYNAJEM
      - name: Uruchom - OTODOM RENT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_tom_rent.py

      # SKRYPT 3: DODATKOWY (np. statystyki lub inny plik)
      - name: Uruchom - INNY SKRYPT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./twoj_trzeci_skrypt.py
