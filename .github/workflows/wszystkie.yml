name: Multiskrypt Otodom - Sprzedaż, Wynajem i Statystyki

on:
  schedule:
    # Uruchamia się co 12 godzin (05:30 i 17:30 UTC)
    # W Polsce (czas zimowy) to 06:30 i 18:30
    - cron: '30 */12 * * *'
  workflow_dispatch: # Przycisk do ręcznego odpalania

    

jobs:
  automation-job:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # SKRYPT 1: SPRZEDAŻ
      - name: Uruchom - OTODOM Tomaszow SELL
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_tom_sell.py

      # SKRYPT 2: WYNAJEM
      - name: Uruchom - OTODOM Tomaszow RENT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_tom_rent.py

      # SKRYPT 3: DODATKOWY (np. statystyki lub inny plik)
      - name: Uruchom - OTODOM Pabianice RENT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_pabia_rent.py

      # SKRYPT 4: DODATKOWY (np. statystyki lub inny plik)
      - name: Uruchom - OTODOM Katowice RENT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./otodom_kato_rent.py
        
      # SKRYPT 5: DODATKOWY (np. statystyki lub inny plik)
      - name: Uruchom - OLX Tomaszow RENT
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./olx_tom_rent.py

      # SKRYPT 6: DODATKOWY (np. statystyki lub inny plik)
      - name: Uruchom - OLX Pabianice Rent
        continue-on-error: true
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python ./olx_pabia_rent.py
