name: Codzienny Automat Python

on:
  schedule:
    # Czas podajemy w formacie Cron (UTC). 
    # '0 8 * * *' oznacza codziennie o 8:00 rano czasu UTC (czyli 9:00 lub 10:00 w Polsce).
    - cron: '0 10 * * *' 
  workflow_dispatch: # Ten wpis dodaje przycisk "Run", żebyś mógł odpalić skrypt ręcznie

jobs:
  build:
    runs-on: ubuntu-latest # GitHub uruchomi to na darmowym systemie Linux

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v3

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Możesz wpisać swoją wersję

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run python Otodom_tom_rent.py
        env:
          G_SHEETS_JSON: ${{ secrets.G_SHEETS_JSON }}
        run: python Otodom_tom_sell.py
